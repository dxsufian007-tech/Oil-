name: Build Oli APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          unzip -q Oli_GPT_PIPES_clean.zip
          ls oli

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and run the game tests
        working-directory: oli
        run: |
          npm ci
          npm test

      - name: Copy the web game into the Android project
        working-directory: oli
        run: |
          node build-www.js
          npx cap sync android

      - name: Use the same signing key every time and raise the version number (so each APK installs as an update)
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" oli/android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" oli/android/app/build.gradle
          grep -n "versionCode\|versionName" oli/android/app/build.gradle

      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk Oli.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Oli-apk
          path: Oli.apk

      - name: Also publish the APK on a branch called apk-build
        run: |
          mkdir -p /tmp/out && cp Oli.apk /tmp/out/Oli.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk-build
          git rm -rf --quiet .
          cp /tmp/out/Oli.apk .
          git add Oli.apk
          git commit -q -m "Oli APK build"
          git push -f origin apk-build
