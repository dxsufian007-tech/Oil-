name: Build Oli APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          unzip -q Oli_GPT_PIPES_clean.zip
          ls oli

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Show the preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Install dependencies and run the game tests
        working-directory: oli
        run: |
          npm ci
          npm test

      - name: Copy the web game into the Android project
        working-directory: oli
        run: |
          node build-www.js
          npx cap sync android

      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk Oli.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Oli-apk
          path: Oli.apk
