name: OLI EMPIRE performance TEST APK from perf/architecture

# The owner's request (Nov 11, 21:11): a TEST APK of the performance branch, to try on the phone before any approval.
# NOT a release: perf/architecture is not merged into feature/central-network or main.
# Separate app: package com.oli.oliperf, name "OLI Perf <commit>" - it installs NEXT TO the game, never over it,
# so the installed game (com.oli.olicentral) and its save are not touched. Same fixed signing key as the other builds.
# Result: OliPerf-<commit>.apk on the NEW branch perf-test-apk-build (one file per commit, earlier files kept).
# Does not touch central-update-apk-build, central-apk-build, apk-build, demo-apk-build, map-apk-build, perf-apk-build or any other workflow.
on:
  workflow_dispatch:
  push:
    branches: [perf/architecture]
    paths: ['.github/workflows/perf-test-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The game's commit (the last commit that changed oli/, not this workflow's commit)
        run: echo "SRC=$(git log -1 --format=%h --abbrev=7 -- oli)" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies and run the game tests
        working-directory: oli
        run: |
          npm ci
          npm test
      - name: Copy the web game into the Android project as a separate test app (com.oli.oliperf, "OLI Perf <commit>")
        working-directory: oli
        run: |
          ID=com.oli.oliperf; SHA=$SRC; NAME="OLI Perf $SHA"
          OLI_DEMO=1 OLI_BUILD=$SHA node build-www-map.js
          sed -i "s/\"appId\": \"com.oli.oilgame\"/\"appId\": \"$ID\"/; s/\"appName\": \"OLI EMPIRE\"/\"appName\": \"$NAME\"/" capacitor.config.json
          npx cap sync android
          sed -i "s/applicationId \"com.oli.oilgame\"/applicationId \"$ID\"/" android/app/build.gradle
          sed -i "s/>OLI EMPIRE</>$NAME</g" android/app/src/main/res/values/strings.xml
          grep -q "applicationId \"$ID\"" android/app/build.gradle || { echo "package id is not $ID"; exit 1; }
          grep -n "app_name" android/app/src/main/res/values/strings.xml
      - name: Fixed signing key, version code from this workflow's run
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" oli/android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"perf-$SRC\"/" oli/android/app/build.gradle
          grep -n "versionCode\|versionName" oli/android/app/build.gradle
      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk OliPerf-$SRC.apk
      - name: Check the signature and the package
        run: |
          F=OliPerf-$SRC.apk; BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BT}apksigner verify --print-certs $F | tee /tmp/certs.txt
          grep -qi "SHA-256 digest: 3f5e924227aef8c5d1783ae6677db8b9b0a36a1c7b086b457133e6a4375e1aaf" /tmp/certs.txt || { echo "APK is NOT signed with the fixed key"; exit 1; }
          ${BT}aapt dump badging $F | head -3
          ls -l $F
      - uses: actions/upload-artifact@v4
        with:
          name: OliPerf-test-apk
          path: OliPerf-*.apk
      - name: Publish on the branch perf-test-apk-build (earlier test APKs are kept)
        run: |
          F=OliPerf-$SRC.apk; mkdir -p /tmp/out && cp $F /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin perf-test-apk-build >/dev/null; then git fetch -q origin perf-test-apk-build && git checkout -q -B perf-test-apk-build FETCH_HEAD && git rm -rf --quiet --ignore-unmatch oli .github >/dev/null 2>&1 || true; else git checkout --orphan perf-test-apk-build && git rm -rf --quiet .; fi
          cp /tmp/out/$F .
          git add $F
          git commit -q -m "OLI Perf test APK $SRC (perf/architecture, not a release)"
          git push origin perf-test-apk-build
