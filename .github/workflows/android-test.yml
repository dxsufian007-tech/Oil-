name: Android test (real Android system)

# Installs the latest Oli.apk (branch apk-build) on an Android 14 system and drives it with Android's own touch input.
# Results (report, screenshots, logcat) are published on the branch android-test.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest APK
        run: |
          git fetch origin apk-build
          git show origin/apk-build:Oli.apk > Oli.apk
          ls -l Oli.apk

      - name: Allow the emulator to use hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: DevTools client
        run: npm install --no-save chrome-remote-interface@0.33.2

      - name: Run the test on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/android/run.sh

      - name: Report as annotations
        if: always()
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$1" | head -c 3800; }
          [ -f results/report.txt ] && echo "::notice title=report::$(enc results/report.txt)" || echo "::notice title=report::no report.txt"
          [ -f results/crash.txt ] && echo "::notice title=crash::$(enc results/crash.txt)" || true
          [ -s results/logcat-errors.txt ] && echo "::notice title=logcat errors::$(head -40 results/logcat-errors.txt > /tmp/le.txt; enc /tmp/le.txt)" || echo "::notice title=logcat errors::none"
          [ -f results/targets.json ] && echo "::notice title=webview targets::$(enc results/targets.json)" || true

      - name: Publish the results on the branch android-test
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -x
          ls -la results || true
          mkdir -p /tmp/pub/results && cp -r results/. /tmp/pub/results/ 2>/dev/null || echo "no results folder" > /tmp/pub/results/missing.txt
          cd /tmp/pub
          git init -q -b android-test
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Android test results"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-test > /tmp/push.txt 2>&1 || { echo "::notice title=push error::$(tail -5 /tmp/push.txt | tr '\n' ' ')"; exit 1; }
