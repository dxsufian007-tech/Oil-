name: Demo APK (everything unlocked, $100M)

# Beta build: current feature/building-system (commit e0f362d), OLI_DEMO on.
# Manual only. A SEPARATE app (Oli Demo, id com.oli.oildemo): $100M, every building unlocked, every region open, every oil field drillable. Result: branch demo-apk-build (OliDemo.apk).
on:
  workflow_dispatch:
    inputs:
      perf:
        description: 'Performance-test build (separate app Oli Perf + hidden measurement panel)'
        type: boolean
        default: false
  push:
    branches: [feature/building-system]
    paths: ['.github/workflows/demo-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: oli
        run: npm ci
      - name: Package the preview page and make it a separate Android app
        working-directory: oli
        env:
          PERF: ${{ inputs.perf }}
        run: |
          if [ "$PERF" = "true" ]; then ID=com.oli.oilperf; NAME="OLI EMPIRE Perf"; OLI_DEMO=1 OLI_PERF=1 OLI_PERF_BUILD=${GITHUB_SHA::7} node build-www-map.js; npm install @capacitor/filesystem@^8 @capacitor/share@^8; else ID=com.oli.oildemo; NAME="OLI EMPIRE"; OLI_DEMO=1 OLI_BUILD=${GITHUB_SHA::7} node build-www-map.js; fi
          sed -i "s/\"appId\": \"com.oli.oilgame\"/\"appId\": \"$ID\"/; s/\"appName\": \"OLI EMPIRE\"/\"appName\": \"$NAME\"/" capacitor.config.json
          npx cap sync android
          sed -i "s/applicationId \"com.oli.oilgame\"/applicationId \"$ID\"/" android/app/build.gradle
          sed -i "s|<string name=\"app_name\">OLI EMPIRE</string>|<string name=\"app_name\">$NAME</string>|" android/app/src/main/res/values/strings.xml
          grep -n "applicationId" android/app/build.gradle
      - name: Same signing key as the game
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" oli/android/app/build.gradle
      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk OliDemo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OliDemo-apk
          path: OliDemo.apk
      - name: Publish the APK on the branch demo-apk-build (perf build goes to perf-apk-build)
        env:
          PERF: ${{ inputs.perf }}
        run: |
          BR=demo-apk-build; F=OliDemo.apk; if [ "$PERF" = "true" ]; then BR=perf-apk-build; F=OliPerf.apk; cp OliDemo.apk OliPerf.apk; fi
          mkdir -p /tmp/out && cp $F /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan $BR
          git rm -rf --quiet .
          cp /tmp/out/$F .
          git add $F
          git commit -q -m "Oli Demo APK"
          git push -f origin $BR
