name: Central Network Test APK (separate app)

# Test build of branch feature/central-network (Central Hybrid Pipeline Network). A SEPARATE app (OLI Central Test, id com.oli.olicentral): it never replaces the game or the demo.
# Result: branch central-apk-build (OliCentral.apk). Does not touch build-apk.yml, demo-apk.yml or demo-apk-build. Not merged to main.
on:
  workflow_dispatch:
  push:
    branches: [feature/central-network]
    paths: ['.github/workflows/central-test-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: oli
        run: npm ci
      - name: Package the game page and make it a separate Android app
        working-directory: oli
        run: |
          ID=com.oli.olicentral; NAME="OLI Central Test"; OLI_DEMO=1 OLI_BUILD=${GITHUB_SHA::7} node build-www-map.js
          sed -i "s/\"appId\": \"com.oli.oilgame\"/\"appId\": \"$ID\"/; s/\"appName\": \"OLI EMPIRE\"/\"appName\": \"$NAME\"/" capacitor.config.json
          npx cap sync android
          sed -i "s/applicationId \"com.oli.oilgame\"/applicationId \"$ID\"/" android/app/build.gradle
          sed -i "s|<string name=\"app_name\">OLI EMPIRE</string>|<string name=\"app_name\">$NAME</string>|" android/app/src/main/res/values/strings.xml
          grep -n "applicationId" android/app/build.gradle
      - name: Same signing key as the game
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode $((300 + ${{ github.run_number }}))/" oli/android/app/build.gradle
      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk OliCentral.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OliCentral-apk
          path: OliCentral.apk
      - name: Publish the APK on the branch central-apk-build
        run: |
          mkdir -p /tmp/out && cp OliCentral.apk /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan central-apk-build
          git rm -rf --quiet .
          cp /tmp/out/OliCentral.apk .
          git add OliCentral.apk
          git commit -q -m "OLI Central Test APK"
          git push -f origin central-apk-build
