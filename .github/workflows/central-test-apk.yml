name: OLI EMPIRE Update APK

# Build an update for the original installed OLI EMPIRE app (com.oli.olicentral) using the original signing key.
# Result: branch central-apk-build (Oli.apk). Does not touch build-apk.yml, demo-apk.yml or demo-apk-build. Not merged to main.
# Build stamp: 2026-11-11 help sheet + refinery/central fixes + no material purchase + cards after pipe mode
on:
  workflow_dispatch:
  push:
    branches: [feature/central-network]
    paths: ['.github/workflows/central-test-apk.yml', 'oli/economy.js', 'oli/test-refinery-v2.js']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: oli
        run: |
          npm ci
          npm test
      - name: Package the game page and package the original installed OLI EMPIRE application
        working-directory: oli
        run: |
          ID=com.oli.olicentral; NAME="OLI EMPIRE"; OLI_DEMO=1 OLI_BUILD=${GITHUB_SHA::7} node build-www-map.js
          sed -i "s/\"appId\": \"com.oli.oilgame\"/\"appId\": \"$ID\"/; s/\"appName\": \"OLI EMPIRE\"/\"appName\": \"$NAME\"/" capacitor.config.json
          npx cap sync android
          sed -i "s/applicationId \"com.oli.oilgame\"/applicationId \"$ID\"/" android/app/build.gradle
          sed -i "s|<string name=\"app_name\">OLI EMPIRE</string>|<string name=\"app_name\">$NAME</string>|" android/app/src/main/res/values/strings.xml
          grep -n "applicationId" android/app/build.gradle
      - name: Same signing key as the game
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode $((300 + ${{ github.run_number }}))/" oli/android/app/build.gradle
      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk Oli.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Oli-apk
          path: Oli.apk
      - name: Publish the APK on the branch central-apk-build
        run: |
          mkdir -p /tmp/out && cp Oli.apk /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan central-apk-build
          git rm -rf --quiet .
          cp /tmp/out/Oli.apk .
          git add Oli.apk
          git commit -q -m "OLI Central Test APK"
          git push -f origin central-apk-build
