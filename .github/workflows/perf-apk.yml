name: Performance-test APK (OLI Performance Architecture, phase 0-1: measurement only)

# Manual only. A SEPARATE app (Oli Perf, id com.oli.oilperf): the demo game + the hidden measurement panel (perf-panel.js). Never part of a normal build. Result: branch perf-apk-build (OliPerf.apk).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        working-directory: oli
        run: npm ci
      - name: Package the preview page and make it a separate Android app
        working-directory: oli
        run: |
          OLI_DEMO=1 OLI_PERF=1 OLI_PERF_BUILD=${GITHUB_SHA::7} node build-www-map.js
          npm install --no-save @capacitor/filesystem@^8 @capacitor/share@^8
          sed -i 's/"appId": "com.oli.oilgame"/"appId": "com.oli.oilperf"/; s/"appName": "Oli"/"appName": "Oli Perf"/' capacitor.config.json
          npx cap sync android
          sed -i 's/applicationId "com.oli.oilgame"/applicationId "com.oli.oilperf"/' android/app/build.gradle
          sed -i 's|<string name="app_name">Oli</string>|<string name="app_name">Oli Perf</string>|' android/app/src/main/res/values/strings.xml
          grep -n "applicationId" android/app/build.gradle
      - name: Same signing key as the game
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" oli/android/app/build.gradle
      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk OliPerf.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OliPerf-apk
          path: OliPerf.apk
      - name: Publish the APK on the branch perf-apk-build
        run: |
          mkdir -p /tmp/out && cp OliPerf.apk /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan perf-apk-build
          git rm -rf --quiet .
          cp /tmp/out/OliPerf.apk .
          git add OliPerf.apk
          git commit -q -m "Oli Perf APK"
          git push -f origin perf-apk-build
