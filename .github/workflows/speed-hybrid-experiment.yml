name: Hybrid fixed-step experiment
on:
  push:
    branches: [experiment/hybrid-fixed-step-0-5s]
    paths:
      - 'oli/test-speed-hybrid.js'
      - 'oli/core.js'
      - 'oli/package-lock.json'
      - '.github/workflows/speed-hybrid-experiment.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: oli
        run: npm ci
      - name: Run existing regression suite
        working-directory: oli
        run: npm test
      - name: Run hybrid timing benchmark
        working-directory: oli
        run: node test-speed-hybrid.js
