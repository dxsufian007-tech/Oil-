name: OLI EMPIRE performance build as an UPDATE of the installed game (perf/architecture) - B1 test copy, artifact only

# The owner's request (Nov 11, 21:31): the performance build must install as an UPDATE over the game on the phone, keeping the save and the progress.
# Same package as the installed game (com.oli.olicentral, last installed update: central-update-apk.yml run 3 = versionCode 313),
# same fixed signing key, a version code above every earlier build of that package: max(311 + latest central-update run, 313 + this workflow's run) = 314 on the first run.
# The game's commit (the last commit that changed oli/) is stamped in the About page and in versionName.
# Built from perf/architecture - NOT merged into feature/central-network or main, NOT an approved release.
# Result: OliUpdate-perf-<commit>.apk on the new branch perf-update-apk-build (earlier files kept). Touches no other workflow, branch or APK.
on:
  workflow_dispatch:
  push:
    branches: [perf/architecture]
    paths: ['.github/workflows/perf-update-apk.yml']

permissions:
  contents: write
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The game's commit (the last commit that changed oli/)
        run: echo "SRC=$(git log -1 --format=%h --abbrev=7 -- oli)" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies and run the game tests
        working-directory: oli
        run: |
          npm ci
          npm test
      - name: Copy the web game into the Android project as the installed app (com.oli.olicentral, OLI EMPIRE)
        working-directory: oli
        run: |
          ID=com.oli.olicentral; OLI_DEMO=1 OLI_BUILD=$SRC node build-www-map.js
          grep -o "OLI_VERSION=\"[^\"]*\"" www/index.html; grep -q "· $SRC" www/index.html || { echo "the About stamp is not $SRC"; exit 1; }
          sed -i "s/\"appId\": \"com.oli.oilgame\"/\"appId\": \"$ID\"/" capacitor.config.json
          npx cap sync android
          sed -i "s/applicationId \"com.oli.oilgame\"/applicationId \"$ID\"/" android/app/build.gradle
          grep -q "applicationId \"$ID\"" android/app/build.gradle || { echo "package id is not $ID"; exit 1; }
      - name: Same signing key, version code above every earlier build of com.oli.olicentral
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore
          LAST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/central-update-apk.yml/runs?per_page=1" | python3 -c "import json,sys; r=json.load(sys.stdin).get('workflow_runs',[]); print(r[0]['run_number'] if r else 3)")
          VC=$((311 + LAST)); OWN=$((313 + ${{ github.run_number }})); [ "$OWN" -gt "$VC" ] && VC=$OWN; [ "$VC" -gt 313 ] || VC=314
          echo "latest central-update run $LAST -> versionCode $VC"
          sed -i "s/versionCode [0-9]*/versionCode $VC/" oli/android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.1-perf-$SRC\"/" oli/android/app/build.gradle
          grep -n "versionCode\|versionName" oli/android/app/build.gradle
      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk OliUpdate-perf-$SRC.apk
      - name: Check the signature (otherwise the phone refuses the update) and the package
        run: |
          F=OliUpdate-perf-$SRC.apk; BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BT}apksigner verify --print-certs $F | tee /tmp/certs.txt
          grep -qi "SHA-256 digest: 3f5e924227aef8c5d1783ae6677db8b9b0a36a1c7b086b457133e6a4375e1aaf" /tmp/certs.txt || { echo "APK is NOT signed with the fixed key"; exit 1; }
          ${BT}aapt dump badging $F | head -3
          ls -l $F
      - uses: actions/upload-artifact@v4
        with:
          name: OliUpdate-perf-apk
          path: OliUpdate-perf-*.apk
