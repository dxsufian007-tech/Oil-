name: OLI S6 in-app BENCH APK (separate test app, never over the game)

# Owner's request (Nov 18): measure the real save inside the game's WebView, S6 on / S6 off / original engine, X1/X2/X5.
# Separate app: package com.oli.olibench, name "OLI Bench" - installs NEXT TO the game, never over it; the game (com.oli.olicentral) and its save are not touched.
# Same fixed signing key as every other build. Engine files are copied unchanged; only oli/bench-app/ is new. Not merged anywhere, not a release.
# Result: OliBench-<commit>.apk on the branch bench-apk-build.
on:
  workflow_dispatch:
  push:
    branches: [bench/s6-apk]
    paths: ['.github/workflows/bench-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The engine commit (the last commit that changed oli/)
        run: echo "SRC=$(git log -1 --format=%h --abbrev=7 -- oli)" >> $GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Bench web dir + Capacitor project as the separate app com.oli.olibench
        working-directory: oli
        run: |
          ID=com.oli.olibench; NAME="OLI Bench"
          npm ci
          node build-www-bench.js
          sed -i "s/\"appId\": \"com.oli.oilgame\"/\"appId\": \"$ID\"/; s/\"appName\": \"OLI EMPIRE\"/\"appName\": \"$NAME\"/" capacitor.config.json
          npx cap sync android
          sed -i "s/applicationId \"com.oli.oilgame\"/applicationId \"$ID\"/" android/app/build.gradle
          sed -i "s/>OLI EMPIRE</>$NAME</g" android/app/src/main/res/values/strings.xml
          grep -q "applicationId \"$ID\"" android/app/build.gradle || { echo "package id is not $ID"; exit 1; }
      - name: Fixed signing key, version code from this workflow's run
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" oli/android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"bench-s6-$SRC\"/" oli/android/app/build.gradle
          grep -n "versionCode\|versionName\|applicationId" oli/android/app/build.gradle
      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk OliBench-$SRC.apk
      - name: Check the signature and the package
        run: |
          F=OliBench-$SRC.apk; BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BT}apksigner verify --print-certs $F | tee /tmp/certs.txt
          grep -qi "SHA-256 digest: 3f5e924227aef8c5d1783ae6677db8b9b0a36a1c7b086b457133e6a4375e1aaf" /tmp/certs.txt || { echo "APK is NOT signed with the fixed key"; exit 1; }
          ${BT}aapt dump badging $F | head -3
          sha256sum $F; ls -l $F
      - uses: actions/upload-artifact@v4
        with:
          name: OliBench-apk
          path: OliBench-*.apk
      - name: Publish on the branch bench-apk-build
        run: |
          F=OliBench-$SRC.apk; mkdir -p /tmp/out && cp $F /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git reset -q --hard; git clean -fdq
          if git ls-remote --exit-code --heads origin bench-apk-build >/dev/null; then git fetch -q origin bench-apk-build && git checkout -q -B bench-apk-build FETCH_HEAD && git rm -rf --quiet --ignore-unmatch oli .github >/dev/null 2>&1 || true; else git checkout --orphan bench-apk-build && git rm -rf --quiet .; fi
          cp /tmp/out/$F .
          git add $F
          git commit -q -m "OLI Bench APK $SRC (S6 branch, separate test app, not a release)"
          git push origin bench-apk-build
