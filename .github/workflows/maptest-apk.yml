name: Map test APK (new map window) + Android test

# Only for the branch feature/map-v4-window. Builds a SEPARATE app (OLI Map Test, id com.oli.maptest) = the game with the new map ground, so it installs NEXT TO the game and never replaces it
# (its own storage: the real game and its save are not touched). The game's own workflows are not changed. Nothing is built unless the whole game test suite and the map tests pass.
# Results: branch maptest-apk-build (OliMapTest.apk) and branch maptest-android-test (Android 14 emulator report).
on:
  workflow_dispatch:
  push:
    branches: [feature/map-v4-window]
    paths: ['oli/**', '.github/workflows/maptest-apk.yml', '.github/android/maptest-*']

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The whole game test suite and the map window tests
        working-directory: oli
        run: |
          npm ci
          npm test
          node test-map-window.js

  apk:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Package the game with the new map as a separate Android app
        working-directory: oli
        run: |
          npm ci
          node build-www.js
          sed -i 's/"appId": "com.oli.oilgame"/"appId": "com.oli.maptest"/; s/"appName": "OLI EMPIRE"/"appName": "OLI Map Test"/' capacitor.config.json
          npx cap sync android
          sed -i 's/applicationId "com.oli.oilgame"/applicationId "com.oli.maptest"/' android/app/build.gradle
          sed -i 's|<string name="app_name">OLI EMPIRE</string>|<string name="app_name">OLI Map Test</string>|; s|<string name="title_activity_main">OLI EMPIRE</string>|<string name="title_activity_main">OLI Map Test</string>|' android/app/src/main/res/values/strings.xml
          grep -n "applicationId" android/app/build.gradle
      - name: Same signing key as the game
        run: |
          mkdir -p ~/.android
          cp .github/signing/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/" oli/android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"map-v4.${{ github.run_number }}\"/" oli/android/app/build.gradle
      - name: Build the APK
        working-directory: oli/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp oli/android/app/build/outputs/apk/debug/app-debug.apk OliMapTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OliMapTest-apk
          path: OliMapTest.apk
      - name: Publish the APK on the branch maptest-apk-build
        run: |
          mkdir -p /tmp/out && cp OliMapTest.apk /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan maptest-apk-build
          git rm -rf --quiet .
          cp /tmp/out/OliMapTest.apk .
          echo "commit ${{ github.sha }}" > SOURCE.txt
          git add OliMapTest.apk SOURCE.txt
          git commit -q -m "OLI Map Test APK from ${{ github.sha }}"
          git push -f origin maptest-apk-build

  android:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get the APK
        run: |
          git fetch origin maptest-apk-build
          git show origin/maptest-apk-build:OliMapTest.apk > OliMapTest.apk
          ls -l OliMapTest.apk
      - name: Allow the emulator to use hardware virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save chrome-remote-interface@0.33.2
      - name: Run the game with the new map on Android 14 (pipes, touch, camera, pump panel, map checks)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/android/maptest-run.sh
      - name: Publish the results on the branch maptest-android-test
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pub/results && cp -r results/. /tmp/pub/results/ 2>/dev/null || echo "no results folder" > /tmp/pub/results/missing.txt
          cd /tmp/pub
          git init -q -b maptest-android-test
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Map test Android results"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" maptest-android-test
