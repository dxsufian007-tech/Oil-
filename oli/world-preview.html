<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Oli - World + Building Lab</title>
<style>
:root{--bg:#10141a;--panel:#1b222c;--ink:#e8e2d2;--mut:#9aa3ad;--acc:#e6a13a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:nowrap;gap:6px;padding:8px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;pointer-events:auto}.bar>*{flex:0 0 auto}
.bar>*{pointer-events:auto}
button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid #33404f;border-radius:8px;padding:8px 10px;min-height:38px}
button.on{background:var(--acc);color:#222;border-color:var(--acc)}
.panel{position:absolute;left:8px;right:8px;bottom:106px;min-height:64px;background:rgba(27,34,44,.94);border:1px solid #33404f;border-radius:12px;padding:10px 12px;max-height:34%;overflow:auto}
.panel h4{margin:0 0 4px;font-size:14px}.panel .k{color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#prog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:14px 18px;border-radius:12px;border:1px solid #33404f}
#hud{position:absolute;left:8px;right:8px;bottom:210px;text-align:right;color:var(--mut);font-size:11px;pointer-events:none}
#pal{position:absolute;left:0;right:0;bottom:0;height:98px;display:flex;gap:6px;padding:6px 8px;overflow-x:auto;overflow-y:hidden;background:rgba(16,20,26,.92);border-top:1px solid #33404f;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;width:92px;padding:2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;border-bottom:3px solid var(--cat);user-select:none;-webkit-user-select:none;touch-action:pan-x}
.chip canvas{position:static;inset:auto;pointer-events:none}.chip span{font-size:11px;line-height:12px;max-width:88px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip i{font-style:normal;font-size:10px;color:var(--mut)}
#buildbar{display:none;position:absolute;left:8px;right:8px;bottom:108px;background:rgba(27,34,44,.97);border:1px solid #4b5a6b;border-radius:12px;padding:8px 10px;z-index:5}
#buildbar .msg{font-weight:600;margin-bottom:6px}#buildbar .good{color:#8dffb0}#buildbar .bad{color:#ffb0a8}#buildbar .btns{display:flex;gap:8px}#buildbar button{flex:1;min-height:46px;font-weight:600}
#buildbar #bBuild:not([disabled]){background:#2f9e5a;border-color:#2f9e5a;color:#fff}#buildbar button[disabled]{opacity:.4}
#toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);background:rgba(27,34,44,.96);border:1px solid #4b5a6b;border-radius:10px;padding:8px 12px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;z-index:6}
#cash{position:absolute;right:10px;top:60px;color:#8dffb0;font-weight:700;pointer-events:none}
table.kv{border-collapse:collapse;width:100%}table.kv td{padding:2px 6px 2px 0;vertical-align:top}table.kv td:first-child{color:var(--mut);white-space:nowrap}
button.danger{background:#a83a30;border-color:#a83a30;color:#fff}
</style></head><body>
<canvas id="c"></canvas>
<div class="bar" id="bar">
 <button data-z="FAR">Far</button><button data-z="MEDIUM">Medium</button><button data-z="CLOSE">Close</button>
 <button id="tReg" class="on">Regions</button><button id="tZone" class="on">Refinery zones</button><button id="tDev">Geology (dev)</button><button id="tHeat">Oil odds (dev)</button><button id="tScale">Scale chart</button>
 <select id="fac"></select>
 <button id="tPipe">Pipe</button><button id="tFields">Field</button><button id="tRef">Refinery zone</button><button id="tSave">Save</button><button id="tLoad">Load</button><button id="tReset">Reset</button>
</div>
<div id="cash"></div><div id="toast"></div>
<div id="hud"></div>
<div id="prog">Generating world…</div>
<div class="panel" id="info">Tap the map: a tile shows terrain and whether the selected facility can be built there. Tap an oil field to inspect what the player may know.</div>
<div id="buildbar"></div><div id="pal"></div>
<script src="worldmap.js"></script>
<script src="buildings.js"></script>
<script src="building-art.js"></script>
<script src="world-preview.js"></script>
<script src="building-lab.js"></script>
</body></html>
